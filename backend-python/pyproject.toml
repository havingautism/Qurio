[project]
name = "qurio-backend"
version = "0.1.0"
description = "Qurio Backend with FastAPI + Agno"
authors = [
    {name = "Qurio", email = "info@qur.io"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.40.0",
    "agno>=2.5.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "httpx>=0.28.1",
    "openai>=2.21.0",
    "google-generativeai>=0.8.6",
    "python-multipart>=0.0.22",
    "sse-starlette>=3.2.0",
    "aiofiles>=25.1.0",
    "supabase>=2.28.0",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.7.21",
    "beautifulsoup4>=4.14.3",
    "pypdf>=6.7.0",
    "yfinance>=1.1.0",
    "arxiv>=2.4.0",
    "wikipedia>=1.4.0",
    "ddgs>=9.10.0",
    "google-genai>=1.63.0",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
    "mcp>=1.26.0",
    "duckduckgo-search>=8.1.1",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.170.0",
    "apscheduler>=3.11.0",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyinstaller>=6.16.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]
